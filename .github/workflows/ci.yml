name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Typecheck & Test (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build dist/index.js bundle
        run: npm run build

      - name: Run unit, integration & E2E tests
        run: npm test

      - name: Smoke-test Annotato Action in Dry-Run mode
        uses: ./
        with:
          doit-api-key: 'dry-run-ci-key'
          release-id: 'ci-${{ github.sha }}'
          labels: 'ci,finops'
          dry-run: 'true'
