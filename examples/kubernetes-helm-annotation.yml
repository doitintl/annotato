name: Deploy Helm release and annotate capacity changes

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Use the same group for every workflow that deploys this release.
concurrency:
  group: production-payments
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      # Install compatible Helm, kubectl and jq versions if your runner needs them.
      # Replace this step with your existing cluster authentication if appropriate.
      - name: Configure cluster access
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
        run: |
          umask 077
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          printf 'KUBECONFIG=%s\n' "$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Save last successfully deployed manifests
        # This example updates an existing release. Missing or failed releases
        # stop here rather than silently inventing an empty baseline.
        run: |
          helm status payments --namespace production --output json | jq -e '.info.status == "deployed"' > /dev/null
          helm get manifest payments --namespace production > "$RUNNER_TEMP/before.yaml"

      - name: Upgrade and verify rollout
        run: |
          helm upgrade payments ./chart --namespace production --values values-production.yaml --wait --timeout 10m
          kubectl rollout status deployment/payments --namespace production --timeout=10m
          helm get manifest payments --namespace production > "$RUNNER_TEMP/after.yaml"

      - name: Annotate configured capacity changes
        uses: doitintl/annotato@v0.2.0
        with:
          doit-api-key: ${{ secrets.DOIT_API_KEY }}
          manifest-before: ${{ runner.temp }}/before.yaml
          manifest-after: ${{ runner.temp }}/after.yaml
          manifest-namespace: production
          reports: ${{ vars.DOIT_REPORT_IDS }}
          labels: production, kubernetes
          create-missing-labels: 'true'
          fail-on-error: 'false'
