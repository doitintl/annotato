apiVersion: apps/v1
kind: Deployment
metadata:
  name: annotato-plain
  namespace: annotato-test
  labels:
    app.kubernetes.io/name: annotato-demo
    app.kubernetes.io/instance: annotato-plain
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: annotato-demo
      app.kubernetes.io/instance: annotato-plain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: annotato-demo
        app.kubernetes.io/instance: annotato-plain
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: annotato-plain
  namespace: annotato-test
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: annotato-demo
    app.kubernetes.io/instance: annotato-plain
  ports:
    - name: http
      port: 80
      targetPort: http
